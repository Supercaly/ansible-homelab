---
# yaml-language-server: $schema=none
groups:
- name: ZfsExporter
  rules:
    - alert: ZfsPoolOutOfSpace
      expr: 'zfs_pool_free_bytes * 100 / zfs_pool_size_bytes < 10 and zfs_pool_readonly == 0 and zfs_pool_size_bytes > 0'
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: ZFS pool out of space ({{ $labels.hostname }})
        description: "ZFS pool {{ $labels.pool }} is almost full (< 10% left).\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

    - alert: ZfsPoolUnhealthy
      expr: 'zfs_pool_health > 0'
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: ZFS pool unhealthy ({{ $labels.hostname }})
        description: "ZFS pool {{ $labels.pool }} state is {{ $value }}.\n 0: ONLINE, 1: DEGRADED, 2: FAULTED, 3: OFFLINE, 4: UNAVAIL, 5: REMOVED, 6: SUSPENDED\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

    - alert: ZfsCollectorFailed
      expr: 'zfs_scrape_collector_success != 1'
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: ZFS collector failed ({{ $labels.hostname }})
        description: "ZFS collector for {{ $labels.instance }} has failed to collect information\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

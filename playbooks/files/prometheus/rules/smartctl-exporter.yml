---
# yaml-language-server: $schema=none
groups:
- name: SmartctlExporter
  rules:
    # drive_trip is not exposed by this exporter for either device — using a fixed threshold instead.
    - alert: SmartDeviceHighTemperature
      expr: 'smartctl_device_temperature{temperature_type="current"} > 60'
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: SMART device high temperature ({{ $labels.device }} on {{ $labels.hostname }})
        description: "Device {{ $labels.device }} on {{ $labels.instance }} temperature is {{ $value }}°C (threshold: 60°C)\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

    - alert: SmartStatus
      expr: 'smartctl_device_smart_status != 1'
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: SMART status ({{ $labels.hostname }})
        description: "Device has a SMART status failure on {{ $labels.instance }} drive {{ $labels.device }}\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

    - alert: SmartCriticalWarning
      expr: 'smartctl_device_critical_warning > 0'
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: SMART critical warning ({{ $labels.hostname }})
        description: "Disk controller has critical warning on {{ $labels.instance }} drive {{ $labels.device }}\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

    - alert: SmartMediaErrors
      expr: 'smartctl_device_media_errors > 0'
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: SMART media errors ({{ $labels.hostname }})
        description: "Disk controller detected media errors on {{ $labels.instance }} drive {{ $labels.device }}\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

    - alert: SmartWearoutIndicator
      expr: 'smartctl_device_available_spare < smartctl_device_available_spare_threshold'
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: SMART Wearout Indicator ({{ $labels.hostname }})
        description: "Device is wearing out on {{ $labels.instance }} drive {{ $labels.device }}\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

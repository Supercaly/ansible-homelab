---
# Sets up the staging Proxmox environment (networking, NAT, DNS/DHCP).
# The guest VM must be created manually before running this playbook.
#
# ─── Prerequisites ───────────────────────────────────────────────────────────
#
#   1. Create the staging VM manually in Proxmox (host_proxmox).
#      Attach net0 to vmbr0 (real network) and note the VMID.
#      Boot the VM and verify SSH access at guest_wan_ip.
#   2. Run the plays in tag order (see Tags below).
#
# ─── Network architecture ────────────────────────────────────────────────────
#
#   host_proxmox  (physical Proxmox, default: vega)
#     vmbr0  ──  real network (10.0.0.0/24), uplink to router
#     vmbr1  ──  isolated bridge, no uplink, no IP  [created by tag: bridge]
#
#   guest VM  (nested Proxmox, default name: pve)
#     net0  →  host vmbr0  →  nic0  inside guest  →  guest vmbr1  (WAN)
#     net1  →  host vmbr1  →  ens19 inside guest  →  guest vmbr0  (LAN)
#                                                     [net1 added by tag: nic]
#   Inside guest (bridge names are inverted relative to host):
#     vmbr0  ──  LAN, guest_lan_ip/24, test VMs connect here
#     vmbr1  ──  WAN, guest_wan_ip/24, gateway to real network
#
#   Test VMs (on guest vmbr0)
#     receive IP/GW/DNS via DHCP from dnsmasq on the guest
#
# ─── Variables ───────────────────────────────────────────────────────────────
#
#   All variables can be overridden at runtime with -e varname=value.
#   Extra vars take precedence over the defaults defined in each play.
#
#   Physical host
#     host_proxmox        vega            Inventory hostname of the Proxmox host
#     host_lan_bridge     vmbr1           Isolated bridge to create on host
#
#   Guest VM  (Play: nic — uses Proxmox API to attach net1)
#     guest_vm_id         9000            VMID of the staging VM
#     guest_proxmox_name  pve             VM name in Proxmox (also Ansible target name)
#
#   Guest networking  (Play: router — configures interfaces, NAT, DNS/DHCP)
#     guest_vm_user       root            SSH user for Ansible to connect as
#     guest_wan_ip        10.0.0.50       IP of the guest on the real network (WAN)
#     guest_wan_gw        10.0.0.1        Default gateway on the real network
#     guest_lan_ip        192.168.1.1     LAN gateway IP inside the guest
#     guest_lan_network   192.168.1.0/24  LAN subnet (used for NAT and DHCP)
#     guest_wan_nic       nic0            Guest NIC on vmbr0 (WAN) — from net0
#     guest_lan_nic       ens19           Guest NIC on vmbr1 (LAN) — from net1
#     guest_dns_upstream  10.0.0.10       Upstream DNS server (e.g. AdGuard)
#     guest_dhcp_range    192.168.1.100,192.168.1.200   DHCP pool for test VMs
#
#   Mac route  (Play: route — adds a static route on the local machine)
#     guest_wan_ip        10.0.0.50       (same as above, repeated for standalone use)
#     guest_lan_network   192.168.1.0/24  (same as above, repeated for standalone use)
#
# ─── Tags ────────────────────────────────────────────────────────────────────
#
#   Run in order, or pass multiple tags to run a subset of steps:
#
#   bridge   Create isolated bridge (vmbr1) on the physical Proxmox host
#   nic      Stop guest VM, attach net1 → vmbr1 via API, restart
#   router   Write /etc/network/interfaces, enable NAT, configure dnsmasq+DHCP
#   route    Add static route on the Mac: guest_lan_network via guest_wan_ip
#
# ─── Usage ───────────────────────────────────────────────────────────────────
#
#   # Full setup (run all steps in order)
#   ansible-playbook playbooks/setup_staging.yml -i inventory/production
#
#   # Override VM-specific vars
#   ansible-playbook playbooks/setup_staging.yml -i inventory/production \
#     -e guest_vm_id=8001 -e guest_proxmox_name=pve -e guest_wan_ip=10.0.0.50
#
#   # Run a single step (router config only, guest must already be reachable)
#   ansible-playbook playbooks/setup_staging.yml -i inventory/production \
#     --tags router

# ---------------------------------------------------------------------------
# Play 1 — Configure isolated bridge on physical Proxmox
# ---------------------------------------------------------------------------
- name: Configure isolated bridge on physical Proxmox.
  hosts: "{{ host_proxmox | default('vega') }}"
  gather_facts: false
  become: true
  tags: bridge
  vars:
    host_lan_bridge: "vmbr1"
  handlers:
    - name: Reload network configuration.
      ansible.builtin.command: ifreload -a
      changed_when: true
  tasks:
    - name: Deploy isolated LAN bridge config to /etc/network/interfaces.
      ansible.builtin.blockinfile:
        path: /etc/network/interfaces
        marker: "# {mark} ANSIBLE MANAGED BLOCK - staging environemt nics"
        block: |
          auto {{ host_lan_bridge }}
          iface {{ host_lan_bridge }} inet manual
              bridge-ports none
              bridge-stp off
              bridge-fd 0
        insertbefore: ^source
      notify: Reload network configuration.

# ---------------------------------------------------------------------------
# Play 2 — Add LAN NIC to guest VM
# ---------------------------------------------------------------------------
- name: Add LAN NIC to guest VM.
  hosts: "{{ host_proxmox | default('vega') }}"
  gather_facts: false
  become: true
  tags: nic
  vars:
    proxmox_api_host: "localhost"
    host_lan_bridge: "vmbr1"
    guest_vm_id: 9000
    guest_proxmox_name: "proxmox-staging"
    guest_wan_ip: "10.0.0.50"
  tasks:
    - name: Stop guest VM.
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        validate_certs: "{{ proxmox_validate_certs | default(omit) }}"
        vmid: "{{ guest_vm_id }}"
        state: stopped

    - name: Add net1 → host_lan_bridge as LAN NIC.
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        validate_certs: "{{ proxmox_validate_certs | default(omit) }}"
        vmid: "{{ guest_vm_id }}"
        name: "{{ guest_proxmox_name }}"
        update: true
        update_unsafe: true
        net:
          net1: "virtio,bridge={{ host_lan_bridge }}"

    - name: Start guest VM.
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        validate_certs: "{{ proxmox_validate_certs | default(omit) }}"
        vmid: "{{ guest_vm_id }}"
        state: started

    - name: Wait for guest VM SSH.
      ansible.builtin.wait_for:
        host: "{{ guest_wan_ip }}"
        port: 22
        timeout: 120
        delay: 10

# ---------------------------------------------------------------------------
# Play 3 — Register guest VM as Ansible target
# ---------------------------------------------------------------------------
- name: Register guest VM as Ansible target.
  hosts: localhost
  gather_facts: false
  tags: [bridge, nic, router, route]
  vars:
    guest_proxmox_name: pve
    guest_vm_user: root
    guest_wan_ip: 10.0.0.50
    guest_wan_gw: 10.0.0.1
    guest_lan_ip: 192.168.1.1
    guest_lan_network: 192.168.1.0/24
    guest_wan_nic: nic0
    guest_lan_nic: ens19
    guest_dns_upstream: 10.0.0.10
    guest_dhcp_range: "192.168.1.100,192.168.1.200"
  tasks:
    - name: Register guest VM as Ansible target for subsequent plays.
      ansible.builtin.add_host:
        name: "{{ guest_proxmox_name }}"
        groups: lab_pve
        ansible_host: "{{ guest_wan_ip }}"
        ansible_user: "{{ guest_vm_user }}"
        guest_wan_ip: "{{ guest_wan_ip }}"
        guest_wan_gw: "{{ guest_wan_gw }}"
        guest_lan_ip: "{{ guest_lan_ip }}"
        guest_lan_network: "{{ guest_lan_network }}"
        guest_wan_nic: "{{ guest_wan_nic }}"
        guest_lan_nic: "{{ guest_lan_nic }}"
        guest_dns_upstream: "{{ guest_dns_upstream }}"
        guest_dhcp_range: "{{ guest_dhcp_range }}"

# ---------------------------------------------------------------------------
# Play 4 — Configure guest Proxmox as NAT router
# ---------------------------------------------------------------------------
- name: Configure guest Proxmox as NAT router.
  hosts: lab_pve
  gather_facts: false
  become: true
  tags: router
  handlers:
    - name: Reload network configuration.
      ansible.builtin.command: ifreload -a
      changed_when: true
    - name: Restart dnsmasq.
      ansible.builtin.systemd:
        name: dnsmasq
        state: restarted
  tasks:
    - name: Configure /etc/network/interfaces.
      ansible.builtin.copy:
        dest: /etc/network/interfaces
        content: |
          auto lo
          iface lo inet loopback

          iface {{ guest_lan_nic }} inet manual

          auto vmbr0
          iface vmbr0 inet static
                  address {{ guest_lan_ip }}
                  netmask 255.255.255.0
                  bridge-ports {{ guest_lan_nic }}
                  bridge-stp off
                  bridge-fd 0

          iface {{ guest_wan_nic }} inet manual

          auto vmbr1
          iface vmbr1 inet static
                  address {{ guest_wan_ip }}
                  netmask 255.255.255.0
                  gateway {{ guest_wan_gw }}
                  bridge-ports {{ guest_wan_nic }}
                  bridge-stp off
                  bridge-fd 0

          source /etc/network/interfaces.d/*
        mode: "0644"
        owner: "root"
        group: "root"
      notify: Reload network configuration.

    # --- IPv4 forwarding ---
    - name: Enable IPv4 forwarding persistently.
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        state: present
        sysctl_file: /etc/sysctl.d/99-staging-router.conf
        reload: true

    # --- NAT ---
    - name: Install iptables-persistent.
      ansible.builtin.apt:
        name: iptables-persistent
        state: present
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Set MASQUERADE rule for lab network.
      ansible.builtin.iptables:
        table: nat
        chain: POSTROUTING
        source: "{{ guest_lan_network }}"
        out_interface: vmbr1
        jump: MASQUERADE
        state: present
      register: iptables_nat

    - name: Save iptables rules. # noqa: no-handler
      ansible.builtin.shell: iptables-save > /etc/iptables/rules.v4
      changed_when: true
      when: iptables_nat.changed

    # --- DNS + DHCP: dnsmasq ---
    - name: Install dnsmasq.
      ansible.builtin.apt:
        name: dnsmasq
        state: present

    - name: Configure dnsmasq for lab network.
      ansible.builtin.copy:
        dest: /etc/dnsmasq.d/lab.conf
        content: |
          interface=vmbr0
          listen-address={{ guest_lan_ip }}
          bind-interfaces
          no-resolv
          server={{ guest_dns_upstream }}
          dhcp-range={{ guest_dhcp_range }},12h
          dhcp-option=option:router,{{ guest_lan_ip }}
          dhcp-option=option:dns-server,{{ guest_lan_ip }}
        mode: "0644"
      notify: Restart dnsmasq.

    - name: Enable and start dnsmasq.
      ansible.builtin.systemd:
        name: dnsmasq
        enabled: true
        state: started

# ---------------------------------------------------------------------------
# Play 5 — Add route to lab network on Mac
# ---------------------------------------------------------------------------
- name: Add route to lab network on Mac.
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  tags: route
  vars:
    guest_wan_ip: "10.0.0.50"
    guest_lan_network: "192.168.1.0/24"
  tasks:
    - name: Check existing routes.
      ansible.builtin.command: netstat -nr
      register: route_table
      changed_when: false

    - name: Add route to lab network.
      ansible.builtin.command: "sudo route -n add -net {{ guest_lan_network }} {{ guest_wan_ip }}"
      changed_when: true

    - name: Get route to lab network.
      ansible.builtin.command: "route get {{ guest_lan_network }}"
      changed_when: false
      register: route_set

    - name: Print route to lab network.
      ansible.builtin.debug:
        var: route_set.stdout_lines

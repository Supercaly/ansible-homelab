---
system_groups_host:
  # Groups for shared media, photos, and backups
  - name: "media"
    gid: 2000
  - name: "photo"
    gid: 2001
  - name: "backup"
    gid: 2010

system_users_host:
  # Users for shared media, photos, and backups
  - name: "media"
    uid: 2000
    comment: "Owns shared media directories"
    group: "media"
    password_lock: true
    system: true
    create_home: false
    shell: /usr/sbin/nologin

  - name: "photo"
    uid: 2001
    comment: "Owns shared photo directories"
    group: "photo"
    password_lock: true
    system: true
    create_home: false
    shell: /usr/sbin/nologin

  - name: "backup"
    uid: 2010
    comment: "Owns shared backup directories"
    group: "backup"
    password_lock: true
    system: true
    create_home: false
    shell: /usr/sbin/nologin

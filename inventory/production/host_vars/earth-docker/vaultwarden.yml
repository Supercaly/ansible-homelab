---
vaultwarden_server_version: "1.36.0"
vaultwarden_timezone: "{{ system_locale_timezone }}"
vaultwarden_backup_version: "1.26.11"

vaultwarden_domain: "pwd.{{ network.domain }}"
vaultwarden_port: 8001

# TODO: Configure notifications on backup jobs
vaultwarden_root: "/srv/stacks/vaultwarden"
vaultwarden_remote_dir: "/backup/vaultwarden"
vaultwarden_zip_password: "{{ vault_vaultwarden_zip_password }}"
vaultwarden_backup_cron: "0 0 * * *"
vaultwarden_backup_keep_days: 30
vaultwarden_rclone_config:
  type: "smb"
  host: "{{ network.ip4 | ansible.utils.nthhost(3) }}"
  user: "backup"
  pass: "{{ vault_vaultwarden_smb_pass }}"
vaultwarden_config:
  domain: "https://{{ vaultwarden_domain }}"
  signups_allowed: false
  org_creation_users: none
  invitations_allowed: false
  email_change_allowed: false
  password_hints_allowed: false
  show_password_hint: false
  admin_token: "{{ vault_vaultwarden_admin_token }}"

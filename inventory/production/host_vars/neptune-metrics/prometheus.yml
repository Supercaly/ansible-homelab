---
# yaml-language-server: $schema=none
prometheus_file_sd_dir: "/etc/prometheus/file_sd"
prometheus_storage_retention: "30d"
prometheus_storage_retention_size: "18GB"

prometheus_global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

prometheus_external_labels:
  env: production

prometheus_scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:{{ prometheus_port }}"
  - job_name: "node"
    file_sd_configs:
      - files: ["{{ prometheus_file_sd_dir }}/node.yml"]
  - job_name: "pve"
    file_sd_configs:
      - files: ["{{ prometheus_file_sd_dir }}/pve.yml"]
    metrics_path: /pve
    params:
      module: [default]
      cluster: ['1']
      node: ['1']
  - job_name: "docker"
    file_sd_configs:
      - files: ["{{ prometheus_file_sd_dir }}/docker.yml"]

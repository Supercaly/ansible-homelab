---
# yaml-language-server: $schema=none
prometheus_caddy_port: "9180"
prometheus_file_sd:
  node:
    - targets: ["{{ interfaces.lan.ip4.address }}:{{ node_exporter_port }}"]
      labels:
        hostname: "{{ inventory_hostname }}"
  caddy:
    - targets: ["{{ interfaces.lan.ip4.address }}:{{ prometheus_caddy_port }}"]
      labels:
        hostname: "{{ inventory_hostname }}"

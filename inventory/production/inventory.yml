---
all:
  children:
    # --- Structural groups (real machines, and VMs) ---
    # Physical Proxmox hosts
    hypervisor:
      hosts:
        vega:
        altair:

    # All VMs and containers
    guest:
      children:
        lxc:
        kvm:
    lxc:
      hosts:
        mercury-dns:
        mars-proxy:
        saturn-media:
    kvm:
      hosts:
        earth-docker:

    # --- Functional groups ---
    # Used by playbooks as targets across inventories.

    # DNS servers
    dns:
      hosts:
        mercury-dns:

    # Reverse proxies
    proxy:
      hosts:
        mars-proxy:

    # Docker hosts
    docker:
      hosts:
        earth-docker:

    # Media servers
    media:
      hosts:
        saturn-media:

    # NFS hosts
    nfs-server:
      hosts:
        altair:
    nfs-client:
      hosts:
        earth-docker:

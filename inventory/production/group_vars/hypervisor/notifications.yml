---
pve_notifications_public:
  - type: smtp
    name: mail-to-gmail
    server: "{{ smtp_host }}"
    port: "{{ smtp_port }}"
    mode: starttls
    username: "{{ smtp_username }}"
    from-address: "{{ smtp_from }}"
    mailto:
      - "{{ smtp_to }}"
    author: "PVE {{ inventory_hostname }}"
  - type: matcher
    name: default-matcher
    target: mail-to-gmail

pve_notifications_private:
  - type: smtp
    name: mail-to-gmail
    password: "{{ smtp_password }}"

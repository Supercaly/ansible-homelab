---
# yaml-language-server: $schema=none
pve_exporter_user: "node-exp"
pve_exporter_group: "node-exp"
zfs_exporter_user: "node-exp"
zfs_exporter_group: "node-exp"
smartctl_exporter_system_user: "root"
smartctl_exporter_system_group: "root"

prometheus_file_sd:
  node:
    - targets: ["{{ ansible_host }}:{{ node_exporter_port }}"]
      labels:
        hostname: "{{ inventory_hostname }}"
  pve:
    - targets: ["{{ ansible_host }}:9221"]
      labels:
        hostname: "{{ inventory_hostname }}"
  zfs:
    - targets: ["{{ ansible_host }}:9134"]
      labels:
        hostname: "{{ inventory_hostname }}"
  smartctl:
    - targets: ["{{ ansible_host }}:9633"]
      labels:
        hostname: "{{ inventory_hostname }}"

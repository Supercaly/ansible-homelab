---
system_users_all:
  # Ansible management user
  # This user should be already present since we are using
  # Ansible (duh), but we ensure it is properly configured.
  - name: ansible
    comment: "Ansible management user"
    password_lock: true
    generate_ssh_key: true
    authorized_keys:
      - "{{ controller_ssh_pubkey }}"
    sudo_options:
      - "ALL=(ALL) NOPASSWD: ALL"

    # Personal admin user
  - name: lorenzo
    comment: "Lorenzo Calisti"
    password: "{{ vault_admin_password }}"
    generate_ssh_key: true
    authorized_keys:
      - "{{ controller_ssh_pubkey }}"
      - "{{ vault_phone_ssh_pubkey }}"
    sudo_options:
      - "ALL=(ALL) ALL"

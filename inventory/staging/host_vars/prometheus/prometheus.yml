---
# yaml-language-server: $schema=none
prometheus_storage_retention: "30d"

prometheus_global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

prometheus_external_labels:
  env: staging

prometheus_scrape_configs:
  - job_name: "{{ inventory_hostname }}"
    static_configs:
      - targets:
          - "localhost:9090"

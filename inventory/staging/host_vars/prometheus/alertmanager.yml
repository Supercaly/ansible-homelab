---
# yaml-language-server: $schema=none
alertmanager_domain: "alertmanager.{{ network.domain }}"
alertmanager_web_external_url: "https://{{ alertmanager_domain }}/"

alertmanager_smtp:
  from: "root@{{ inventory_hostname }}"
  smarthost: "localhost:25"
  require_tls: "false"

alertmanager_receivers:
  - name: "null"
  - name: email
    email_configs:
      - to: "lorenzo@pve.{{ network.domain }}"

alertmanager_route:
  receiver: email
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - alertname=~"Watchdog|PrometheusAlertmanagerE2eDeadManSwitch"
      receiver: "null"

    # Templates have IDs >= 9000 by convention — they are always stopped
    - matchers:
        - alertname="PveGuestDown"
        - id=~"(qemu|lxc)/9[0-9]+"
      receiver: "null"

    - matchers:
        - severity="info"
      receiver: email
      repeat_interval: 24h

alertmanager_inhibit_rules:
  # If a node is unreachable (node_exporter down), suppress all other alerts from that host
  - source_matchers:
      - alertname="PrometheusTargetMissing"
      - job="node"
    target_matchers:
      - alertname!="PrometheusTargetMissing"
    equal: ['hostname']

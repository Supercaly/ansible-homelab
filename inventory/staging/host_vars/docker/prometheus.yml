---
# yaml-language-server: $schema=none
prometheus_scrape_configs:
  - job_name: "{{ inventory_hostname }}"
    static_configs:
      - targets:
          - "{{ interfaces.lan.ip4.address }}:9100"

  - job_name: "{{ inventory_hostname }}-cadvisor"
    static_configs:
      - targets:
          - "{{ interfaces.lan.ip4.address }}:8080"

---
ddns_root: /srv/stacks/ddns
ddns_port: 8000
ddns_config:
  settings:
    - provider: "{{ vault_ddns_provider }}"
      domain: "{{ vault_ddns_domain }}"
      username: "{{ vault_ddns_username }}"
      password: "{{ vault_ddns_password }}"
      ip_version: "ipv4"
ddns_shoutrrr_address: >-
  smtp://{{ smtp_username }}:{{ smtp_password | ansible.builtin.urlencode }}@{{
    smtp_host }}:{{ smtp_port }}/?from={{ smtp_from }}&to={{
    smtp_to }}&FromName=DDNS

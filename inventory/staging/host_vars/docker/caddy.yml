---
caddy_sites:
  - name: "ddns"
    content: |
        https://ddns.{{ network.domain }} {
          import logging "ddns.log"
          import encode
          import private

          reverse_proxy "{{ interfaces.lan.ip4.address }}:{{ ddns_port }}"
        }
  - name: "vaultwarden"
    content: |
        https://{{ vaultwarden_domain }} {
          import logging "vaultwarden.log"
          import encode
          import private

          reverse_proxy "{{ interfaces.lan.ip4.address }}:{{ vaultwarden_port }}"
        }
  - name: "portfolio"
    content: |
        https://lorenzo.{{ network.domain }} {
          import logging "portfolio.log"
          import encode
          import private

          reverse_proxy "{{ interfaces.lan.ip4.address }}:{{ portfolio_port }}"
        }
  - name: "immich"
    content: |
        https://photo.{{ network.domain }} {
          import logging "immich.log"
          import encode
          import private

          reverse_proxy "{{ interfaces.lan.ip4.address }}:{{ immich_port }}"
        }

---
all:
  children:
    # --- Structural groups (real machines, and VMs) ---
    # Physical Proxmox hosts
    hypervisor:
      hosts:
        pve:

    # All VMs and containers
    guest:
      children:
        lxc:
        kvm:
    lxc:
      hosts:
        adguard:
        caddy:
        ntfy:
        influxdb:
        grafana:
        jellyfin:
    kvm:
      hosts:
        docker:

    # --- Functional groups ---
    # Used by playbooks as targets across inventories.

    # DNS servers
    dns:
      hosts:
        adguard:

    # Reverse proxies
    proxy:
      hosts:
        caddy:

    # Media servers
    media:
      hosts:
        jellyfin:

    # NFS hosts
    nfs-server:
      hosts:
        pve:
    nfs-client:
      hosts:
        docker:

    # Samba hosts
    samba-server:
      hosts:
        pve:

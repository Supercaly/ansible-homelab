---
# yaml-language-server: $schema=none
pve_exporter_user: "node-exp"
pve_exporter_group: "node-exp"
prometheus_scrape_configs:
  - job_name: "{{ inventory_hostname }}"
    static_configs:
      - targets:
          - "{{ ansible_host }}:9100"

  - job_name: "{{ inventory_hostname }}-pve"
    static_configs:
      - targets:
          - "{{ ansible_host }}:9221"
    metrics_path: /pve
    params:
      module: [default]
      cluster: ['1']
      node: ['1']

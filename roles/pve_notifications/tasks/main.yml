---
- name: Ensure notification public config file exists.
  ansible.builtin.command:
    cmd: touch /etc/pve/notifications.cfg
    creates: /etc/pve/notifications.cfg

- name: Configure Proxmox notification targets and matchers.
  ansible.builtin.template:
    src: notifications.cfg.j2
    dest: /etc/pve/notifications.cfg
    mode: "0640"
    unsafe_writes: true

- name: Ensure notification private config file exists.
  ansible.builtin.command:
    cmd: touch /etc/pve/priv/notifications.cfg
    creates: /etc/pve/priv/notifications.cfg

- name: Configure Proxmox notification credentials.
  ansible.builtin.template:
    src: notifications_priv.cfg.j2
    dest: /etc/pve/priv/notifications.cfg
    mode: "0600"
    unsafe_writes: true
  no_log: true

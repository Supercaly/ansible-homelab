---
# Written directly to the conf file because Proxmox APIs and pct set don't support lxc.* raw config.
# Note: lines removed from raw_config are not automatically removed from the conf file.
- name: Set raw LXC config.
  when: proxmox_lxc.raw_config is defined and proxmox_lxc.raw_config | length > 0
  ansible.builtin.lineinfile:
    path: "/etc/pve/lxc/{{ proxmox_lxc.vmid | ansible.builtin.mandatory }}.conf"
    line: "{{ __line }}"
    state: present
  loop: "{{ proxmox_lxc.raw_config }}"
  loop_control:
    loop_var: "__line"

---
- name: nut_create_tmpfiles # noqa: name[casing]
  ansible.builtin.command:
    cmd: systemd-tmpfiles --create /etc/tmpfiles.d/nut-upssched.conf
  changed_when: true

- name: nut_restart_upsd # noqa: name[casing]
  ansible.builtin.service:
    name: "{{ _nut_server_service }}"
    state: restarted
  when: nut_mode in ['standalone', 'netserver']

- name: nut_restart_upsmon # noqa: name[casing]
  ansible.builtin.service:
    name: "{{ _nut_client_service }}"
    state: restarted

---
- name: Ensure dependencies are present.
  ansible.builtin.apt:
    name:
      - python3-debian
    state: present

- name: Remove legacy jellyfin.list repository if present.
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/jellyfin.list
    state: absent

- name: Ensure /etc/apt/keyrings directory exists.
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Add Jellyfin apt key.
  ansible.builtin.get_url:
    url: "{{ jellyfin_apt_gpg_key }}"
    dest: "{{ jellyfin_apt_key_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Add Jellyfin repository.
  ansible.builtin.deb822_repository:
    name: jellyfin
    types: deb
    uris: "{{ jellyfin_apt_url }}"
    suites: "{{ jellyfin_apt_suites }}"
    components: main
    architectures: "{{ jellyfin_apt_arch }}"
    signed_by: "{{ jellyfin_apt_key_path }}"
    state: present
  notify: update apt cache

- name: Flush handlers.
  ansible.builtin.meta: flush_handlers

---
# Caddy system user
caddy_user: "caddy"
caddy_group: "caddy"

# Name of the caddy service
caddy_service_name: caddy

# Path to caddy config dir
caddy_config_dir: "/etc/caddy"

# Path to caddy logs dir
caddy_log_dir: "/var/log/caddy"

# Path to the Caddyfile
caddy_caddyfile_file: "{{ caddy_config_dir }}/Caddyfile"

# Path to the sites dir
caddy_sites_dir: "{{ caddy_config_dir }}/sites"

# Remove all old sites not in the current config
caddy_rm_unmanaged_sites: true

# ---------------------------
# Caddyfile-related variables
# ---------------------------

# Enable debug mode
caddy_debug: false

# Customize the admin API endpoint
# If set to `off` the admin endpoint is disabled
caddy_admin: "localhost:2019"

# Email address used when creating an ACME account with the CA
caddy_email: ""

# Issue all certificates internally, rather than through a public ACME CA
caddy_local_certs: false

# ACME endpoint to use
# Possible values: [default, staging]
caddy_ca: "default"
# Default ACME API endpoint
caddy_default_ca: "https://acme-v02.api.letsencrypt.org/directory"
# Staging ACME API endpoint
caddy_staging_ca: "https://acme-staging-v02.api.letsencrypt.org/directory"

# List of sites to manage.
caddy_sites: []

# -----------------------
# xcaddy / plugin options
# -----------------------

# List of Caddy plugins to build with xcaddy.
# When empty, Caddy is installed via the OS package manager.
# When non-empty, Caddy is compiled with xcaddy and the listed plugins.
caddy_plugins: []

# Caddy version to build with xcaddy. Empty string means latest.
caddy_version: ""

# xcaddy version to install. Empty string means latest from GitHub releases.
caddy_xcaddy_version: ""

# Go version to install for building with xcaddy. Empty string means latest stable from go.dev.
caddy_go_version: ""

# Directory where Go is installed.
caddy_go_install_dir: "/usr/local/go"

# Path to the xcaddy binary.
caddy_xcaddy_bin: "/usr/local/bin/xcaddy"

# Remove Go, xcaddy, and build tarballs after a successful build.
# Recommended for production: leaves only the Caddy binary on the server.
# Set to false to keep the toolchain installed (useful for debugging).
caddy_xcaddy_cleanup: true

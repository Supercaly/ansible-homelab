---
- name: Check installed Go version.
  ansible.builtin.command: "{{ caddy_go_install_dir }}/bin/go version"
  register: __caddy_go_installed
  changed_when: false
  failed_when: false

- name: Install Go {{ __go_version }}.
  when: __caddy_go_installed.rc != 0 or ('go' + __go_version) not in __caddy_go_installed.stdout
  block:
    - name: Download Go tarball.
      ansible.builtin.get_url:
        url: "https://go.dev/dl/go{{ __go_version }}.linux-{{ __caddy_arch }}.tar.gz"
        dest: "/tmp/go{{ __go_version }}.linux-{{ __caddy_arch }}.tar.gz"
        mode: "0644"

    - name: Remove previous Go installation.
      ansible.builtin.file:
        path: "{{ caddy_go_install_dir }}"
        state: absent

    - name: Extract Go to {{ caddy_go_install_dir }}.
      ansible.builtin.unarchive:
        src: "/tmp/go{{ __go_version }}.linux-{{ __caddy_arch }}.tar.gz"
        dest: "{{ caddy_go_install_dir | dirname }}"
        remote_src: true

    - name: Ensure Go binaries are on PATH.
      ansible.builtin.file:
        src: "{{ caddy_go_install_dir }}/bin/{{ __go_bin }}"
        dest: "/usr/local/bin/{{ __go_bin }}"
        state: link
        force: true
      loop:
        - go
        - gofmt
      loop_control:
        loop_var: __go_bin
